name: Publish to npm

on:
  push:
    tags:
      - 'v*.*.*'
  # Lets a failed release be retried without cutting a new tag.
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Trusted publishing: the job authenticates to npm with a short-lived OIDC token
      # instead of a long-lived NPM_TOKEN, and npm attaches provenance on its own.
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Trusted publishing needs Node 22.14 or later; the toolchain needs 22 or
          # later; the package itself supports Node 20.
          node-version: 22
          cache: npm
          # No registry-url on purpose. It makes setup-node write an .npmrc with
          # `_authToken=${NODE_AUTH_TOKEN}` and export a placeholder token
          # (XXXXX-XXXXX-XXXXX-XXXXX) when none is given, which sends npm down the
          # token path instead of OIDC. npm defaults to registry.npmjs.org anyway.

      # The npm that ships with Node 22 predates trusted publishing, which needs 11.5.1
      # or later.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # No NODE_AUTH_TOKEN: the npm CLI detects the OIDC environment and exchanges the
      # id-token for a short-lived credential. Provenance is generated by npm itself
      # here, so --provenance is not passed.
      #
      # The release is staged rather than published: it lands in the registry unlisted
      # and goes live only once a maintainer approves it with 2FA, from npmjs.com or
      # with `npm stage approve <stage-id>`. That is what the trusted publisher allows,
      # and it keeps a human in front of every release.
      - name: Stage the release for approval
        run: npm stage publish --access public
