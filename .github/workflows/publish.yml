name: Publish to npm

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Trusted publishing: the job authenticates to npm with a short-lived OIDC token
      # instead of a long-lived NPM_TOKEN, and npm attaches provenance on its own.
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Trusted publishing needs Node 22.14 or later; the toolchain needs 22 or
          # later; the package itself supports Node 20.
          node-version: 22
          registry-url: https://registry.npmjs.org/
          cache: npm

      # The npm that ships with Node 22 predates trusted publishing, which needs 11.5.1
      # or later.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # No NODE_AUTH_TOKEN: the npm CLI detects the OIDC environment and exchanges the
      # id-token for a short-lived publish credential. Provenance is generated by npm
      # itself here, so --provenance is not passed.
      - name: Publish package
        run: npm publish --access public
